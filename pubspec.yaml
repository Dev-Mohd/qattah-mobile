name: qattah
description: "وين قطّتكم؟ — تطبيق إدارة مصاريف الوجبات المشتركة"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  fl_chart: ^0.70.2
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^5.0.2
  timezone: ^0.10.1
  share_plus: ^13.1.0
  uuid: ^4.4.0
  sticky_headers: ^0.3.0
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  pdf: ^3.12.0
  printing: ^5.14.3
  file_selector: ^1.1.0
  sqflite_sqlcipher: ^3.4.0
  sqlcipher_flutter_libs: ^0.7.0+eol
  flutter_secure_storage: ^10.2.0
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/brand/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
    - family: SaudiRiyal
      fonts:
        - asset: assets/fonts/SaudiRiyal.ttf
        - asset: assets/fonts/SaudiRiyal-Bold.ttf
          weight: 700
