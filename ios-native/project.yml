# XcodeGen spec — generates Qattah.xcodeproj.
#   brew install xcodegen cocoapods
#   xcodegen generate && pod install
#   open Qattah.xcworkspace
name: Qattah
options:
  bundleIdPrefix: qattah.com
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: U8874JC7QW
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO   # required by CocoaPods script phases
    APP_GROUP_ID: group.$(BASE_BUNDLE_ID)
  configs:
    # Debug builds (run from Xcode) install NEXT TO the App Store app with
    # their own empty data, so testing on a personal iPhone is safe.
    Debug:
      BASE_BUNDLE_ID: qattah.com.qattah.dev
      APP_DISPLAY_NAME: قطه تجريبي
    # Release keeps the Flutter app's bundle id → ships as an update and
    # opens the existing users' data.
    Release:
      BASE_BUNDLE_ID: qattah.com.qattah
      APP_DISPLAY_NAME: قطه

packages:
  QattahKit:
    path: Packages/QattahKit

targets:
  Qattah:
    type: application
    platform: iOS
    sources:
      - path: Qattah
      - path: Shared
    dependencies:
      - package: QattahKit
      - target: QattahWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad: the Flutter version supported both
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: Qattah/Qattah.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    info:
      path: Qattah/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleDevelopmentRegion: ar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad must allow every orientation (multitasking requirement).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts: [SaudiRiyal.ttf, SaudiRiyal-Bold.ttf]
        ITSAppUsesNonExemptEncryption: false
        QattahAppGroup: $(APP_GROUP_ID)
        CFBundleURLTypes:
          - CFBundleURLName: $(BASE_BUNDLE_ID)
            CFBundleURLSchemes: [qattah]

  QattahWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: QattahWidget
      - path: Shared/Widget
    dependencies:
      - package: QattahKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).widget
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad: the Flutter version supported both
        SKIP_INSTALL: YES
    entitlements:
      path: QattahWidget/QattahWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    info:
      path: QattahWidget/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        QattahAppGroup: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  QattahTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: QattahTests
    dependencies:
      - target: Qattah
      - package: QattahKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: qattah.com.qattah.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Qattah:
    build:
      targets:
        Qattah: all
        QattahTests: [test]
    test:
      targets:
        - QattahTests
        - package: QattahKit/QattahKitTests
